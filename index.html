<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Protótipo navegável do Adoteme, versão 2.">
<title>Adoteme v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de celular (390 × 844) centralizado no computador; tela cheia no celular. Painel de controles fora da tela do app. */
:root{
  --bg:#ECE9F4;            /* fundo atrás do celular */
  --app:#FFFFFF;           /* fundo das telas */
  --surface:#F6F4FB;       /* campos, chips, caixas */
  --line:#E2DDEE;
  --text:#2A2638;
  --muted:#5C566F;         /* texto secundário mais escuro que o cinza-claro da v1: 7:1 sobre branco */
  --primary:#7262A6;       /* roxo do Figma (#7C6BAA, 4,6:1) um tom mais escuro: 5,2:1 com texto branco */
  --primary-strong:#5A4B8C;
  --primary-soft:#ECE8F7;
  --on-primary:#FFFFFF;
  --heart:#D9443E;
  --ok:#236B43; --ok-soft:#E3F3E9;
  --warn:#8A5A00; --warn-soft:#FBF0D9;
  --panel:#1E1B27; --panel-text:#F2EFF8; --panel-accent:#B9AAE6;
  --shadow:0 18px 50px rgba(40,30,70,.18);
  --font-title:"Poppins",system-ui,sans-serif;
  --font-body:"Nunito Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0D15;--app:#17141F;--surface:#221E2D;--line:#332D42;--text:#EEEAF6;--muted:#B9B2CB;
  --primary:#B9AAE6;--primary-strong:#D2C7F2;--primary-soft:#2C2540;--on-primary:#1B1626;
  --heart:#FF7A73;--ok:#86D9A7;--ok-soft:#1C3326;--warn:#F2C46B;--warn-soft:#3A2E14;
  --panel:#F2EFF8;--panel-text:#1E1B27;--panel-accent:#5A4B8C;--shadow:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0D15;--app:#17141F;--surface:#221E2D;--line:#332D42;--text:#EEEAF6;--muted:#B9B2CB;
  --primary:#B9AAE6;--primary-strong:#D2C7F2;--primary-soft:#2C2540;--on-primary:#1B1626;
  --heart:#FF7A73;--ok:#86D9A7;--ok-soft:#1C3326;--warn:#F2C46B;--warn-soft:#3A2E14;
  --panel:#F2EFF8;--panel-text:#1E1B27;--panel-accent:#5A4B8C;--shadow:0 18px 50px rgba(0,0,0,.5);color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}

.stage{min-height:100%;display:grid;place-items:center;padding-block:24px}
.phone{width:390px;max-width:100%;height:min(844px,calc(100vh - 48px));background:var(--app);border-radius:36px;box-shadow:var(--shadow);
  overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:520px){
  body{padding-left:0;padding-right:0}
  .stage{padding-block:0;display:block;height:100%}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.pad{padding:18px 20px 24px}
h1,h2,h3{font-family:var(--font-title);margin:0;text-wrap:balance;color:var(--text)}
h1{font-size:24px;line-height:1.2;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:18px;height:18px}
.ico.fill{fill:currentColor}

/* Botões: um padrão só, 48 px de altura, raio 12 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;
  font-family:var(--font-title);font-weight:600;font-size:15px;text-decoration:none}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-strong)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-outline{background:transparent;border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--primary);min-height:44px;padding:0 8px}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--text)}
.icon-btn.on-photo{background:rgba(255,255,255,.92);color:#2A2638}

/* Campos */
label.lbl{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.field{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;font-size:15px}
.field:focus{border-color:var(--primary);outline:none}
.field.err{border-color:var(--heart)}
.msg-err{color:var(--heart);font-size:13px;margin-top:4px;font-weight:600}
.search{position:relative}
.search .field{padding-left:44px}
.search .ico{position:absolute;left:14px;top:13px;color:var(--muted)}

/* Topo e barra inferior */
.top{display:flex;align-items:center;gap:10px;padding:16px 20px 8px}
.brand{font-family:var(--font-title);font-weight:700;font-size:19px;color:var(--primary);display:flex;align-items:center;gap:6px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.initial{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-strong);font-weight:800;flex:none}
.badge-dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--heart);border:2px solid var(--surface)}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--app);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;position:relative}
.tab .pill{width:56px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"] .pill{background:var(--primary-soft)}
.tab .count{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--heart);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* Home */
.banner{border-radius:18px;background:var(--primary);color:var(--on-primary);display:grid;grid-template-columns:1fr 120px;overflow:hidden;min-height:128px}
.banner h2{color:var(--on-primary);font-size:19px;line-height:1.2}
.banner .txt{padding:18px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.banner img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 16px;font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:0;padding:0;background:var(--app);border-radius:16px;overflow:hidden;text-align:left;box-shadow:0 2px 14px rgba(40,30,70,.1);display:flex;flex-direction:column;position:relative}
:root[data-theme="dark"] .card{box-shadow:none;border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{box-shadow:none;border:1px solid var(--line)}}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;max-width:100%}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card .heart{position:absolute;top:8px;right:8px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-soft{background:var(--primary-soft);color:var(--primary-strong)}

/* Detalhe */
.hero-photo{position:relative;height:330px}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-photo .bar{position:absolute;inset:14px 14px auto;display:flex;justify-content:space-between}
.sheet{background:var(--app);border-radius:26px 26px 0 0;margin-top:-28px;position:relative;padding:12px 20px 24px}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fact{border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.fact b{display:block;font-size:14px}
.fact span{font-size:12px;color:var(--muted);font-weight:700}
.tutor{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface)}
.action{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--primary);font-size:12px;font-weight:800;min-width:56px}
.action .circle{width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.footer-cta{position:sticky;bottom:0;background:var(--app);padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}

/* Listas */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
.unread{min-width:22px;height:22px;border-radius:11px;background:var(--primary);color:var(--on-primary);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.empty{text-align:center;padding:40px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* Formulário de adoção */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--primary)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 16px;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-strong)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--primary);flex:none;margin-top:1px}
.timeline{display:flex;flex-direction:column;gap:14px;text-align:left}
.timeline .st{display:flex;gap:12px}
.timeline .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--primary-soft);color:var(--primary-strong)}
.timeline .n.done{background:var(--ok);color:var(--app)}

/* Conversa */
.bubbles{display:flex;flex-direction:column;gap:8px;padding:16px 20px}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px}
.bubble.them{background:var(--surface);border-bottom-left-radius:4px;align-self:flex-start}
.bubble.me{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px;align-self:flex-end}
.bubble time{display:block;font-size:11px;opacity:.75;margin-top:2px}
.composer{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}

/* Folha inferior, modal e aviso */
.scrim{position:absolute;inset:0;background:rgba(20,15,35,.45);display:flex;align-items:flex-end;z-index:20}
.scrim.center{align-items:center;justify-content:center;padding:24px}
.bottom-sheet{background:var(--app);width:100%;border-radius:24px 24px 0 0;padding:14px 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.dialog{background:var(--app);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;width:100%}
.toast{position:absolute;left:16px;right:16px;bottom:88px;background:var(--text);color:var(--app);border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;z-index:30}

/* Arco da abertura */
.arch{border-radius:200px 200px 24px 24px;overflow:hidden;height:360px}
.arch img{width:100%;height:100%;object-fit:cover;object-position:55% 50%}
.arch.sm{height:150px;border-radius:150px 150px 0 0}

/* Numeração das melhorias (liga no painel) */
.mk{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:6px;background:#F2B705;color:#1E1B27;font:800 11px/1 var(--font-body);
  box-shadow:0 0 0 2px #1E1B27;vertical-align:middle;margin-left:6px}
.mk.abs{position:absolute;z-index:5;margin:0}

/* Painel de controles */
.ctl-btn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--panel);color:var(--panel-text);
  border:2px dashed var(--panel-accent);border-radius:999px;padding:10px 16px;font-weight:800;font-size:13px}
.ctl{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:50;width:300px;max-width:calc(100vw - 32px);
  max-height:calc(100vh - 100px);overflow:auto;background:var(--panel);color:var(--panel-text);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.ctl h4{margin:0;font:700 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.ctl .seg{display:flex;gap:6px;flex-wrap:wrap}
.ctl button{background:transparent;color:var(--panel-text);border:1.5px solid currentColor;border-radius:10px;padding:7px 10px;font-weight:700;font-size:12px;opacity:.85}
.ctl button[aria-pressed="true"]{background:var(--panel-accent);border-color:var(--panel-accent);color:var(--panel);opacity:1}
.ctl ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ctl .note{opacity:.7;font-size:12px}
@media (prefers-reduced-motion:no-preference){
  .bottom-sheet{animation:up .22s ease-out}
  .toast{animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
}
</style>
<style>body{margin:0}img{max-width:100%}</style>

  return "";
}

/* ---------- Render e navegação ---------- */
const hist=[];
function go(view,extra){ hist.push({view:S.view,tab:S.tab,pet:S.pet,chat:S.chat}); Object.assign(S,{view},extra||{}); S.overlay=null; render(true); }
function back(){ const h=hist.pop(); if(h){Object.assign(S,h);} else {S.view="abertura";} S.overlay=null; render(true); }
function toast(t){ S.toast=t; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast=null;render();},2600); }
function needLogin(label,then){ if(S.logged) return true; S.afterLogin={label,then}; S.overlay={tipo:"gate",label}; render(); return false; }

function render(scrollTop){
  const app=document.getElementById("app");
  let html="";
  if(S.view==="abertura") html=viewAbertura();
  else if(S.view==="login") html=viewLogin();
  else if(S.view==="pet") html=viewPet();
  else if(S.view==="adocao") html=viewAdocao();
  else if(S.view==="pedido") html=viewPedido();
  else if(S.view==="conversa") html=viewConversa();
  else { const body={inicio:viewInicio,escolhidos:viewEscolhidos,conversas:viewConversas,perfil:viewPerfil}[S.tab]();
    html=`<div class="screen">${body}</div>${tabbar()}`; }
  const active=document.activeElement?.id, sel=[document.activeElement?.selectionStart,document.activeElement?.selectionEnd];
  const st=app.querySelector(".screen")?.scrollTop||0;
  app.innerHTML=html+overlay()+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:"");
  const sc=app.querySelector(".screen"); if(sc) sc.scrollTop=scrollTop?0:st;
  if(active){const el=document.getElementById(active); if(el&&el.focus){el.focus(); try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
  const h=S.view==="main"?S.tab:["pet","adocao","pedido"].includes(S.view)?S.view+"-"+S.pet:S.view==="conversa"?"conversa-"+S.chat:S.view;
  if(location.hash!=="#"+h){ try{history.replaceState(null,"","#"+h);}catch(e){} }
  renderPanel();
  const c=app.querySelector(".bubbles"); if(c){ const s=app.querySelector(".screen"); s.scrollTop=s.scrollHeight; }
}

/* Ao entrar, a conta de exemplo já tem 2 pets salvos */
function contaExemplo(){ if(!S.favs.size){S.favs.add("amora");S.favs.add("nina");} }
function entrar(){
  S.logged=true; S.login.erros={}; contaExemplo();
  const a=S.afterLogin; S.afterLogin=null;
  if(a&&a.then){ a.then(); } else { hist.length=0; S.view="main"; S.tab="inicio"; render(true); }
  toast("Você entrou como Jeniffer");
}

document.addEventListener("click",ev=>{
  const close=ev.target.closest("[data-close]");
  if(close && (ev.target===close || close.tagName==="BUTTON")){ if(S.overlay&&S.overlay.tipo==="gate") S.afterLogin=null; S.overlay=null; render(); return; }
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case "explorar": hist.length=0; S.view="main"; S.tab="inicio"; S.overlay=null; render(true); break;
    case "ir-login": if(b.dataset.label&&!S.afterLogin) S.afterLogin={label:b.dataset.label}; go("login"); break;
    case "voltar": back(); break;
    case "ver-senha": S.login.ver=!S.login.ver; render(); break;
    case "aviso": toast(b.dataset.txt); break;
    case "tab": hist.length=0; S.view="main"; S.tab=b.dataset.tab; S.overlay=null; render(true); break;
    case "cat": S.cat=b.dataset.cat; render(); break;
    case "limpar": S.cat="todos"; S.q=""; render(); break;
    case "abrir-pet": go("pet",{pet:id}); break;
    case "fav": {
      const p=pet(id);
      if(!needLogin("salvar "+art(p)+" "+p.nome,()=>{S.favs.add(id);back();})) break;
      if(S.favs.has(id)){S.favs.delete(id);toast(p.nome+" saiu dos Escolhidos");} else {S.favs.add(id);toast(p.nome+" foi para os Escolhidos");}
      break; }
    case "adotar": {
      const p=pet(id);
      if(!needLogin("pedir a adoção d"+art(p)+" "+p.nome,()=>{back();S.form={moradia:null,tela:null,outros:null,msg:"",termo:false};go("adocao",{pet:id});})) break;
      S.form={moradia:null,tela:null,outros:null,msg:"",termo:false}; go("adocao",{pet:id}); break; }
    case "opt": S.form[b.dataset.campo]=b.dataset.val; render(); break;
    case "enviar-pedido": if(!S.pedidos.includes(S.pet)) S.pedidos.push(S.pet); hist.length=0; S.view="pedido"; render(true); break;
    case "abrir-chat": {
      if(!needLogin("conversar com "+pet(id).tutor.split(" ")[0],()=>{back();if(CHATS[id])CHATS[id].naoLidas=0;go("conversa",{chat:id});})) break;
      if(CHATS[id]) CHATS[id].naoLidas=0; go("conversa",{chat:id}); break; }
    case "ligar": S.overlay={tipo:"ligar",id}; render(); break;
    case "sair": S.overlay={tipo:"sair"}; render(); break;
    case "confirmar-sair": S.logged=false; S.overlay=null; hist.length=0; S.view="abertura"; render(true); toast("Você saiu da conta"); break;
    /* painel */
    case "painel": S.panel=!S.panel; renderPanel(); break;
    case "estado": S.logged=b.dataset.v==="1"; if(S.logged) contaExemplo(); if(!S.logged&&["adocao","pedido","conversa"].includes(S.view)){S.view="main";S.tab="inicio";} render(); break;
    case "marcas": S.marks=!S.marks; render(); break;
    case "pular": hist.length=0; Object.assign(S,JSON.parse(b.dataset.s)); if(S.logged) contaExemplo(); S.overlay=null; render(true); break;
    case "reset": location.hash=""; location.reload(); break;
    case "tema": {
      const atual=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
      const novo=atual==="dark"?"light":"dark"; document.documentElement.dataset.theme=novo;
      try{localStorage.setItem("adoteme-tema",novo);}catch(e){} renderPanel(); break; }
  }
});

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="busca"){S.q=t.value;render();}
  else if(t.id==="email"){S.login.email=t.value;}
  else if(t.id==="senha"){S.login.senha=t.value;}
  else if(t.id==="msgTutor"){S.form.msg=t.value;}
});
document.addEventListener("change",ev=>{ if(ev.target.id==="termo"){S.form.termo=ev.target.checked;render();} });
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(ev.target.id==="formLogin"){
    const L=S.login,e={};
    if(!/^\S+@\S+\.\S+$/.test(L.email)) e.email="Digite um e-mail no formato nome@email.com.";
    if(L.senha.length<6) e.senha="A senha precisa ter pelo menos 6 caracteres.";
    L.erros=e; if(Object.keys(e).length){render();return;} entrar();
  }
  if(ev.target.id==="formMsg"){
    const i=document.getElementById("novaMsg"),v=i.value.trim(); if(!v) return;
    const c=CHATS[S.chat]; c.msgs.push(["me",v,"Agora"]); c.hora="Agora"; render();
    setTimeout(()=>{ c.msgs.push(["them","Que bom! Te respondo com calma já já 💜","Agora"]); render(); },1200);
  }
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&S.overlay){S.overlay=null;render();} });

/* Painel de controles */
function renderPanel(){
  const el=document.getElementById("ctl"),btn=document.getElementById("ctlBtn");
  document.getElementById("ctlState").textContent=S.logged?"com login":"visitante";
  btn.setAttribute("aria-expanded",S.panel); el.hidden=!S.panel; if(!S.panel) return;
  const tema=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const j=o=>esc(JSON.stringify(o));
  el.innerHTML=`<h4>Estado</h4><div class="seg">
      <button data-act="estado" data-v="0" aria-pressed="${!S.logged}">Visitante</button>
      <button data-act="estado" data-v="1" aria-pressed="${S.logged}">Com login</button></div>
    <h4>Ir para a tela</h4><div class="seg">
      <button data-act="pular" data-s="${j({view:"abertura"})}">Abertura</button>
      <button data-act="pular" data-s="${j({view:"main",tab:"inicio"})}">Início</button>
      <button data-act="pular" data-s="${j({view:"pet",pet:"amora"})}">Perfil da Amora</button>
      <button data-act="pular" data-s="${j({view:"adocao",pet:"amora",logged:true})}">Pedido de adoção</button>
      <button data-act="pular" data-s="${j({view:"main",tab:"conversas",logged:true})}">Conversas</button></div>
    <h4>Comparar com a v1</h4><div class="seg"><button data-act="marcas" aria-pressed="${S.marks}">${S.marks?"Esconder":"Mostrar"} melhorias numeradas</button></div>
    <ol>${MELHORIAS.map(([n,t])=>`<li><b>${n}</b> ${t}</li>`).join("")}</ol>
    <h4>Aparência</h4><div class="seg"><button data-act="tema">Mudar para tema ${tema==="dark"?"claro":"escuro"}</button><button data-act="reset">Recomeçar</button></div>
    <p class="note">Dados de exemplo. Este painel não faz parte da tela do app.</p>`;
}

/* Início */
try{const t=localStorage.getItem("adoteme-tema"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
(function(){
  const h=(location.hash||"").slice(1);
  if(TABS.includes(h)){S.view="main";S.tab=h;}
  else if(/^(pet|adocao|pedido)-/.test(h)){const [v,id]=h.split("-"); if(pet(id)){S.view=v;S.pet=id; if(v!=="pet") S.logged=true;}}
  else if(/^conversa-/.test(h)){const id=h.split("-")[1]; if(pet(id)){S.view="conversa";S.chat=id;S.logged=true;}}
  else if(h==="login") S.view="login";
  render(true);
})();
</script>

</body>
</html>
